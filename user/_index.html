<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="src/assets/images/shokujii/shokujii_favicon.png" type="image/png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>食事でつながるshokujii</title>
    <link rel="stylesheet" type="text/css" href="/loader.css" />
    <meta property="og:title" content="{{#if title}}{{title}}{{else}}食事でつながるshokujii{{/if}}">
    <meta property="og:image" content="{{{image}}}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:description" content="{{#if description}}{{description}}{{else}}毎日の食事を出会いの場に。「いただきます」と「ごちそうさま」を言い合える仲間を見つけよう。{{/if}}">
    <meta property="og:url" content="{{{url}}}">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="食事でつながるshokujii">
    <meta name="twitter:site" content="{{{site}}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{#if title}}{{title}}{{else}}食事でつながるshokujii{{/if}}">
    <meta name="twitter:image" content="{{{image}}}">
    <meta name="twitter:description" content="{{#if description}}{{description}}{{else}}毎日の食事を出会いの場に。「いただきます」と「ごちそうさま」を言い合える仲間を見つけよう。{{/if}}">
  </head>

  <body>
    <div id="app">
      <div id="loading-bg">
        <div class="loading-logo">
          <img src="/shokujii_ogp.png" height="50" alt="Logo" />
        </div>
        <div class="loading">
          <div class="effect-1 effects"></div>
          <div class="effect-2 effects"></div>
          <div class="effect-3 effects"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      const loaderColor = localStorage.getItem('Materio-initial-loader-bg') || '#FFFFFF'
      const primaryColor = localStorage.getItem('Materio-initial-loader-color') || '#9155FD'

      if (loaderColor) document.documentElement.style.setProperty('--initial-loader-bg', loaderColor)
      if (primaryColor) document.documentElement.style.setProperty('--initial-loader-color', primaryColor)
    </script>
  </body>
</html>
