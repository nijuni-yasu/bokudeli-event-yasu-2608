name: Deploy admin

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./admin
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version-file: ./admin/.node-version
        cache: 'npm'
        cache-dependency-path: ./admin/package-lock.json
    - name: Generate .env file
      run: |
        env_vars=$(echo '${{ secrets.ADMIN_ENV_SECRET }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"')
        echo "$env_vars" > .env
    - name: Build
      run: |
        npm install
        npm run build-development
    - name: Install Firebase CLI
      working-directory: .  
      run: npm install -g "firebase-tools@^12"
    - name: Deploy to Firebase
      working-directory: .
      run: |
        firebase use bokudeli-event-test
        firebase deploy --only hosting:admin
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
