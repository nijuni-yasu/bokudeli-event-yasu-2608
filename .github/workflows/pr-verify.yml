name: PR verify

on:
  pull_request:
    branches:
      - development
      - production
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.filter.outputs.common }}
      base: ${{ steps.filter.outputs.base }}
      user: ${{ steps.filter.outputs.user }}
      partner: ${{ steps.filter.outputs.partner }}
      enterprise: ${{ steps.filter.outputs.enterprise }}
      terms: ${{ steps.filter.outputs.terms }}
      functions: ${{ steps.filter.outputs.functions }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            common:
              - 'common/**'
            base:
              - 'base/**'
            user:
              - 'user/**'
            partner:
              - 'partner/**'
            enterprise:
              - 'enterprise/**'
            terms:
              - 'terms/**'
            functions:
              - 'functions/**'
            root:
              - 'package.json'
              - 'package-lock.json'
              - '.node-version'
              - 'scripts/verify-vue-tsc-gate.sh'
              - '.github/workflows/pr-verify.yml'

  verify:
    needs: changes
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: ./.node-version
          cache: npm
          cache-dependency-path: ./package-lock.json
      - name: Verify Functions deploy list
        run: npm run verify:functions-deploy
      - name: Test Functions deploy verifier
        run: npm run test:verify-functions-deploy
      - name: Install dependencies
        run: npm ci
      - name: Verify vue-tsc gate
        if: >-
          needs.changes.outputs.root == 'true' ||
          needs.changes.outputs.base == 'true'
        run: npm run verify:vue-tsc-gate
      - name: Build common
        if: >-
          needs.changes.outputs.common == 'true' ||
          needs.changes.outputs.base == 'true' ||
          needs.changes.outputs.user == 'true' ||
          needs.changes.outputs.partner == 'true' ||
          needs.changes.outputs.enterprise == 'true' ||
          needs.changes.outputs.functions == 'true' ||
          needs.changes.outputs.root == 'true'
        run: npm -w common run build
      - name: Lint
        run: |
          set -e
          run_if() { if [ "$1" = "true" ]; then shift; "$@"; fi; }
          run_if "${{ needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w common run lint
          run_if "${{ needs.changes.outputs.base == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w base run lint
          run_if "${{ needs.changes.outputs.user == 'true' || needs.changes.outputs.base == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w user run lint
          run_if "${{ needs.changes.outputs.partner == 'true' || needs.changes.outputs.base == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w partner run lint
          run_if "${{ needs.changes.outputs.enterprise == 'true' || needs.changes.outputs.base == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w enterprise run lint
          run_if "${{ needs.changes.outputs.terms == 'true' || needs.changes.outputs.root == 'true' }}" npm -w terms run lint
          run_if "${{ needs.changes.outputs.functions == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w functions/default run lint
      - name: Check Format
        run: |
          set -e
          run_if() { if [ "$1" = "true" ]; then shift; "$@"; fi; }
          run_if "${{ needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w common run format:check
          run_if "${{ needs.changes.outputs.base == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w base run format:check
          run_if "${{ needs.changes.outputs.user == 'true' || needs.changes.outputs.base == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w user run format:check
          run_if "${{ needs.changes.outputs.partner == 'true' || needs.changes.outputs.base == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w partner run format:check
          run_if "${{ needs.changes.outputs.enterprise == 'true' || needs.changes.outputs.base == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w enterprise run format:check
          run_if "${{ needs.changes.outputs.terms == 'true' || needs.changes.outputs.root == 'true' }}" npm -w terms run format:check
          run_if "${{ needs.changes.outputs.functions == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w functions/default run format:check
      - name: Typecheck
        run: |
          set -e
          run_if() { if [ "$1" = "true" ]; then shift; "$@"; fi; }
          run_if "${{ needs.changes.outputs.base == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w base run build:types
          run_if "${{ needs.changes.outputs.user == 'true' || needs.changes.outputs.base == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w user run build:types
          run_if "${{ needs.changes.outputs.partner == 'true' || needs.changes.outputs.base == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w partner run build:types
          run_if "${{ needs.changes.outputs.enterprise == 'true' || needs.changes.outputs.base == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w enterprise run build:types
      - name: Build and typecheck functions
        if: >-
          needs.changes.outputs.functions == 'true' ||
          needs.changes.outputs.common == 'true' ||
          needs.changes.outputs.root == 'true'
        run: npm -w functions/default run build
      - name: Test
        run: |
          set -e
          run_if() { if [ "$1" = "true" ]; then shift; "$@"; fi; }
          run_if "${{ needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w common run test
          run_if "${{ needs.changes.outputs.base == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w base run test
          run_if "${{ needs.changes.outputs.user == 'true' || needs.changes.outputs.base == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w user run test
          run_if "${{ needs.changes.outputs.partner == 'true' || needs.changes.outputs.base == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w partner run test
          run_if "${{ needs.changes.outputs.enterprise == 'true' || needs.changes.outputs.base == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w enterprise run test
          run_if "${{ needs.changes.outputs.terms == 'true' || needs.changes.outputs.root == 'true' }}" npm -w terms run build
          run_if "${{ needs.changes.outputs.functions == 'true' || needs.changes.outputs.common == 'true' || needs.changes.outputs.root == 'true' }}" npm -w functions/default run test
