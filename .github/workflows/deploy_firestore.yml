name: Deploy firestore

on:
  push:
    branches:
      - development
      - production
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - development
          - production

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    # push のときだけ GITHUB_REF_NAME を使う（workflow_dispatch のときは inputs.environment を使う）
    # 可読性に欠けるが、うまい手がみつからない
    environment: ${{ github.event_name == 'push' && (github.ref_name == 'production' && 'production' || github.ref_name == 'development' && 'development') || inputs.environment }}
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check firestore.indexes.json has no duplicate composite indexes
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('firestore.indexes.json','utf8'));const ix=j.indexes||[];const seen=new Map();for(let i=0;i<ix.length;i++){const k=JSON.stringify(ix[i]);if(seen.has(k)){console.error('Duplicate firestore composite index at indices',seen.get(k),'and',i);process.exit(1);}seen.set(k,i);}console.log('firestore.indexes.json:',ix.length,'unique composite indexes');"
      - name: Deploy to Firebase
        uses: ./.github/actions/deploy
        with:
          project_id: ${{ vars.PROJECT_ID }}
          service_key: ${{ secrets.GCLOUD_SERVICE_KEY }}
          args: '--force --only firestore'
