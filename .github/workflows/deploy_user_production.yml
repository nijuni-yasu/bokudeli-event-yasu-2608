name: Deploy user to production

on:
  push:
    branches:
      - production
    paths:
      - 'user/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./user
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version-file: ./user/.node-version
        cache: 'yarn'
        cache-dependency-path: ./user/yarn.lock
    - name: Install dependencies
      run: |
        yarn install --frozen-lockfile
    - name: Install Firebase CLI
      working-directory: .
      run: yarn global add firebase-tools
    - name: Generate .env file
      run: |
        env_vars=$(echo '${{ secrets.USER_PRODUCTION_ENV_SECRET }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"')
        echo "$env_vars" > .env
    - name: Build
      run: |
        yarn run build-production
    - name: Deploy to Firebase
      working-directory: .
      # We may use asyncronous jobs to deploy, so we need to use mktemp instead of a fixed path
      run: |
        export GOOGLE_APPLICATION_CREDENTIALS=$(mktemp)
        echo '${{ secrets.GCLOUD_SERVICE_KEY_BOKUDELI_EVENT_DEV_B4302AA7CF39 }}' > $GOOGLE_APPLICATION_CREDENTIALS
        firebase use bokudeli-event-dev
        firebase deploy --only hosting:user
        rm $GOOGLE_APPLICATION_CREDENTIALS
