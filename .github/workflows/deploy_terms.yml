name: Deploy terms

on:
  push:
    branches:
      - production
      - development
    paths:
      - 'terms/**'
      - 'firebase.json'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - development
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref_name || inputs.environment }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && (github.ref_name == 'production' && 'production' || github.ref_name == 'development' && 'development') || inputs.environment }}
    env:
      ENVIRONMENT: ${{ github.event_name == 'push' && (github.ref_name == 'production' && 'production' || github.ref_name == 'development' && 'development') || inputs.environment }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: ./.node-version
          cache: 'npm'
          cache-dependency-path: ./package-lock.json
      - name: Install dependencies
        run: |
          npm ci
      - name: Check Format
        run: |
          npm -w terms run format:check
      - name: Build
        run: |
          npm -w terms run build
      - name: Lint
        run: |
          npm -w terms run lint
      - name: Generate .firebaserc
        run: |
          echo '${{ vars.FIREBASERC }}' > .firebaserc
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCLOUD_SERVICE_KEY }}
          project_id: ${{ vars.PROJECT_ID }}
      - name: Deploy to Firebase
        uses: ./.github/actions/deploy
        with:
          project_id: ${{ vars.PROJECT_ID }}
          args: '--only hosting:terms'
