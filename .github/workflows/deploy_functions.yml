name: Deploy functions

on:
  push:
    branches:
      - production
      - development
    paths:
      - 'functions/**'
      - 'common/**'
      - 'firebase.json'
      - '.github/workflows/deploy_functions.yml'
      - '.github/actions/deploy/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - development
          - production

jobs:
  deploy:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && (github.ref_name == 'production' && 'production' || github.ref_name == 'development' && 'development') || inputs.environment }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: ./.node-version
      - name: Install dependencies
        run: npm ci
      - name: Generate .env file
        working-directory: ./functions/default
        run: echo '${{ vars.FUNCTIONS_ENV }}' | tr -d '\r' > .env
      - name: Check Format
        run: |
          npm -w common run format:check
          npm -w functions/default run format:check
      - name: Build
        run: npm -w functions/default run build
      - name: Lint
        run: |
          npm -w common run lint
          npm -w functions/default run lint
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCLOUD_SERVICE_KEY }}
          project_id: ${{ vars.PROJECT_ID }}
      - name: Deploy to Firebase
        uses: ./.github/actions/deploy
        with:
          project_id: ${{ vars.PROJECT_ID }}
          args: '--only functions'
