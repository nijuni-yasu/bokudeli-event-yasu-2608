name: Test Firestore Rules

on:
  push:
    paths:
      - 'firestore.rules'
      - 'tests/firestore-rules/**'
      - '.github/workflows/test_firestore_rules.yml'
  pull_request:
    branches:
      - development
      - production
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      rules: ${{ steps.filter.outputs.rules }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rules:
              - 'firestore.rules'
              - 'tests/firestore-rules/**'
              - '.github/workflows/test_firestore_rules.yml'

  test:
    needs: changes
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' && needs.changes.outputs.rules == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: ./.node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.15.0

      - name: Run Firestore rules tests
        run: firebase emulators:exec --only firestore "npm -w tests-firestore-rules run test"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
