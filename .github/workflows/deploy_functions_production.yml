name: Deploy functions to production

on:
  push:
    branches:
      - 'production'
    paths:
      - 'functions/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./functions
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version-file: ./functions/.node-version
        cache: 'yarn'
        cache-dependency-path: ./functions/yarn.lock
    - name: Install dependencies
      run: |
        yarn install --frozen-lockfile
    - name: Install Firebase CLI
      working-directory: .
      run: yarn global add firebase-tools
    - name: Generate .env file
      run: |
        env_vars=$(echo '${{ secrets.FUNCTIONS_PRODUCTION_ENV_SECRET }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"')
        echo "$env_vars" > .env
    # FIREBASE_TOKEN is deprecated, so use GOOGLE_APPLICATION_CREDENTIALS
    # We may use asyncronous jobs to deploy, so we need to use mktemp instead of a fixed path
    - name: Set GOOGLE_APPLICATION_CREDENTIALS
      run: |
        echo 'GOOGLE_APPLICATION_CREDENTIALS='$(mktemp) >> $GITHUB_ENV
    - name: Deploy to Firebase
      working-directory: .
      run: |
        echo '${{ secrets.GCLOUD_SERVICE_KEY_BOKUDELI_EVENT_DEV_B4302AA7CF39 }}' > $GOOGLE_APPLICATION_CREDENTIALS
        firebase use bokudeli-event-dev
        firebase deploy --only functions
    - name: Delete GOOGLE_APPLICATION_CREDENTIALS
      run: |
        rm $GOOGLE_APPLICATION_CREDENTIALS
