name: Deploy functions to production

on:
  push:
    branches:
      - production
    paths:
      - "functions/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: ./functions/.node-version
          cache: "yarn"
          cache-dependency-path: |
            ./functions/yarn.lock
            ./functions/shokujii-slackbot/yarn.lock
      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
      - name: Generate .env file
        run: |
          env_vars=$(echo '${{ secrets.FUNCTIONS_PRODUCTION_ENV_SECRET }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"')
          echo "$env_vars" > .env
      - name: Install Dependencies for shokujii-slackbot
        working-directory: ./functions/shokujii-slackbot
        run: |
          yarn install --frozen-lockfile
      - name: Generate .env file to shokujii-slackbot
        working-directory: ./functions/shokujii-slackbot
        run: |
          env_vars=$(echo '${{ secrets.FUNCTIONS_SLACKBOT_PRODUCTION_ENV_SECRET }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"')
          echo "$env_vars" > .env
      - name: Install Dependencies for shokujii-linebot
        working-directory: ./functions/shokujii-linebot
        run: |
          yarn install --frozen-lockfile
      - name: Generate .env file to shokujii-linebot
        working-directory: ./functions/shokujii-linebot
        run: |
          env_vars=$(echo '${{ secrets.FUNCTIONS_LINEBOT_PRODUCTION_ENV_SECRET }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"')
          echo "$env_vars" > .env
      - name: Install Dependencies for shokujii-pdf
        working-directory: ./functions/shokujii-pdf
        run: |
          yarn install --frozen-lockfile
      - name: Generate .env file to shokujii-pdf
        working-directory: ./functions/shokujii-pdf
        run: |
          env_vars=$(echo '${{ secrets.FUNCTIONS_PDF_PRODUCTION_ENV_SECRET }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"')
          echo "$env_vars" > .env
      - name: Deploy to Firebase
        uses: ./.github/actions/deploy
        with:
          project_id: bokudeli-event-dev
          service_key: ${{ secrets.GCLOUD_SERVICE_KEY_BOKUDELI_EVENT_DEV_736E27344811 }}
          args: --only functions
