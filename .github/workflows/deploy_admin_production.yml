name: Deploy admin for production

on:
  push:
    branches:
      - production
    paths:
      - 'admin/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./admin
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version-file: ./admin/.node-version
        cache: 'npm'
        cache-dependency-path: ./admin/package-lock.json
    - name: Generate .env file
      run: |
        env_vars=$(echo '${{ secrets.ADMIN_PRODUCTION_ENV_SECRET }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"')
        echo "$env_vars" > .env
    - name: Build
      run: |
        npm install
        npm run build-production
    - name: Install Firebase CLI
      working-directory: .
      run: npm install -g "firebase-tools@^12"
    # FIREBASE_TOKEN is deprecated, so use GOOGLE_APPLICATION_CREDENTIALS
    - name: Deploy to Firebase
      working-directory: .
      # We may use asyncronous jobs to deploy, so we need to use mktemp instead of a fixed path
      run: |
        export GOOGLE_APPLICATION_CREDENTIALS=$(mktemp)
        echo '${{ secrets.GCLOUD_SERVICE_KEY_BOKUDELI_EVENT_DEV_736E27344811 }}' > $GOOGLE_APPLICATION_CREDENTIALS
        firebase use bokudeli-event-dev
        firebase deploy --only hosting:admin
        rm $GOOGLE_APPLICATION_CREDENTIALS

