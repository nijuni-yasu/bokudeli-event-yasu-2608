name: Deploy admin to development

on:
  push:
    branches:
      - development
    paths:
      - 'admin/**'
      - 'base/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    environment: development
    defaults:
      run:
        shell: bash
        working-directory: ./admin
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version-file: ./admin/.node-version
        cache: 'yarn'
        cache-dependency-path: ./admin/yarn.lock
    - name: Install dependencies
      run: |
        yarn install --frozen-lockfile
    - name: Install Firebase CLI
      run: curl -sL https://firebase.tools | bash
    - name: Generate .env file
      run: |
        echo '${{ vars.ADMIN_ENV }}' | tr -d '\r' > .env
    - name: Build
      run: |
        yarn run build-development
    - name: Deploy to Firebase
      working-directory: .
      # We may use asyncronous jobs to deploy, so we need to use mktemp instead of a fixed path
      run: |
        export GOOGLE_APPLICATION_CREDENTIALS=$(mktemp)
        echo '${{ secrets.GCLOUD_SERVICE_KEY_BOKUDELI_EVENT_TEST_03CF59E61D6C }}' > $GOOGLE_APPLICATION_CREDENTIALS
        firebase use bokudeli-event-test
        firebase deploy --only hosting:admin
        rm $GOOGLE_APPLICATION_CREDENTIALS
